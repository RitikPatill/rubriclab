[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rubriclab-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.29.0,<1",
    "pydantic>=2.7.0,<3",
    "python-dotenv>=1.0.0,<2",
    "pyyaml>=6.0.1,<7",
    "anthropic>=0.40.0,<1",
    "httpx>=0.27.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9",
    "pytest-asyncio>=0.23.0,<1",
    "respx>=0.21.0,<1",
    "ruff>=0.4.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
